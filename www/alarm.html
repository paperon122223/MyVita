<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alarmas - MyVita</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/ui-enhancements.css">
  <link rel="stylesheet" href="css/alarm.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/menu-bottom.css">
</head>
<body>
<div class="app-container">

  <!-- ── Header ──────────────────────────────── -->
  <header class="alarm-header">
    <button class="header-icon" id="backButton" onclick="history.back()">
      <span class="material-icons" style="font-size:20px">arrow_back</span>
    </button>
    <h1>Alarmas</h1>
    <button class="header-icon" id="voiceAssistantBtn" title="Asistente de voz">
      <span class="material-icons" style="font-size:20px">mic</span>
    </button>
  </header>

  <!-- ── Contenido ───────────────────────────── -->
  <main class="alarm-content">

    <!-- Tarjeta formulario -->
    <div class="alarm-form-card">
      <p class="form-card-title">
        <span class="material-icons">add_alarm</span>
        Nueva alarma
      </p>

      <!-- Nombre -->
      <div class="alarm-field">
        <label for="alarmName">Medicamento</label>
        <input class="alarm-input" type="text" id="alarmName"
               placeholder="Ej: Paracetamol 500mg">
      </div>

      <!-- Hora y Tono en fila -->
      <div class="form-row">
        <div class="alarm-field">
          <label for="alarmTime">Hora</label>
          <input class="alarm-input" type="time" id="alarmTime">
        </div>
        <div class="alarm-field">
          <label for="alarmTone">Tono</label>
          <select class="alarm-input" id="alarmTone">
            <option value="alarm.mp3">Tono 1</option>
            <option value="alarma.mp3">Tono 2</option>
          </select>
        </div>
      </div>

      <!-- Botones -->
      <button id="saveAlarmButton" type="button" class="btn-guardar">
        <span class="material-icons">alarm_add</span>
        Guardar alarma
      </button>

      <button id="voiceBtnForm" class="btn-voz">
        <span class="material-icons">mic</span>
        Agregar por voz
      </button>
      <div id="voiceStatus" class="voice-status"></div>
    </div>

    <!-- Encabezado lista -->
    <div class="alarms-header-row">
      <h2 class="alarms-title">Mis alarmas</h2>
      <span class="alarms-count" id="alarmsCount">0</span>
    </div>

    <!-- Estado vacío -->
    <div class="empty-state" id="emptyAlarms" style="display:none">
      <span class="material-icons">notifications_off</span>
      <h3>Sin alarmas</h3>
      <p>Crea tu primera alarma arriba</p>
    </div>

    <!-- Lista -->
    <ul class="alarm-list" id="alarmsContainer"></ul>

  </main>

  <!-- ── Audio ────────────────────────────────── -->
  <audio id="alarmSound" src="audio/alarm.mp3" loop></audio>

  <!-- ── Modal alarma ─────────────────────────── -->
  <div id="alarmModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-icon">
        <span class="material-icons">alarm</span>
      </div>
      <h2 id="modalTitle">¡Es la hora!</h2>
      <p id="modalMessage">Es hora de tomar tu medicamento</p>
      <button id="modalStopButton" class="btn-stop">
        <span class="material-icons" style="vertical-align:middle;font-size:20px;margin-right:6px">check_circle</span>
        Tomado — Apagar
      </button>
      <button id="modalSnoozeButton" class="btn-snooze-modal">
        <span class="material-icons" style="vertical-align:middle;font-size:16px;margin-right:4px">snooze</span>
        Posponer 10 min
      </button>
    </div>
  </div>

</div>

<script src="cordova.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/background.js"></script>
<script src="js/watch.js"></script>
<script src="js/alarm.js"></script>
<script src="js/dark-mode.js"></script>
<script src="js/animations.js"></script>
<script src="js/menu-bottom.js"></script>
</body>
</html>
