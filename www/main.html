<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MediTime - Menú</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="menu-container">
    <h1 class="menu-title">MediTime</h1>
    <div class="menu-grid">
      <div class="menu-card">
        <button id="alarmButton" class="menu-btn">
          <img src="imgfon/alarm.png" alt="">
          <span>Programar Alarma</span>
        </button>
      </div>
      <div class="menu-card">
        <button id="settingsButton" class="menu-btn">
          <img src="imgfon/Ajus.png" alt="">
          <span>Ajustes</span>
        </button>
      </div>
      <div class="menu-card">
        <button id="contactsButton" class="menu-btn">
          <img src="imgfon/contacts.png" alt="">
          <span>Contactos de Emergencia</span>
        </button>
      </div>
    </div>
  </div>

  <script src="cordova.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
