<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="css/main.css">
  <title>Inventario — MyVita</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
   rel="stylesheet">
   <link rel="stylesheet" href="css/ui-enhancements.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/menu-bottom.css">
  <link rel="stylesheet" href="css/inventario.css">
</head>
<body>

<div id="notif-box"></div>

<!-- ── Header ──────────────────────────────────── -->
<header class="app-header">
  <button class="hdr-btn outline" onclick="history.back()">
    <span class="material-icons">arrow_back</span>
  </button>
  <h1>Inventario</h1>
  <button class="hdr-btn outline" onclick="abrirScan()" title="Escanear código de barras">
    <span class="material-icons">qr_code_scanner</span>
  </button>
  <button class="hdr-btn" onclick="abrirModal()" title="Agregar medicamento">
    <span class="material-icons">add</span>
  </button>
</header>

<div class="app-content">

  <!-- Alerta stock bajo -->
  <div id="alertaBanner" style="display:none"></div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow" style="display:none">
    <div class="stat-card">
      <div class="stat-num ok"  id="statOk">0</div>
      <div class="stat-label">En stock</div>
    </div>
    <div class="stat-card">
      <div class="stat-num warn" id="statWarn">0</div>
      <div class="stat-label">Stock bajo</div>
    </div>
    <div class="stat-card">
      <div class="stat-num danger" id="statDanger">0</div>
      <div class="stat-label">Sin stock</div>
    </div>
  </div>

  <!-- Lista -->
  <div id="listaInventario"></div>

</div>

<!-- ══ Modal agregar/editar ══════════════════════ -->
<div id="modalOverlay" class="modal-overlay" style="display:none" onclick="cerrarModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="modal-title">
      <span class="material-icons">inventory_2</span>
      <span id="modalTitulo">Agregar medicamento</span>
    </div>

    <input type="hidden" id="editId">

    <div class="form-group">
      <label class="form-label">Medicamento</label>
      <select class="form-control" id="fPrescripcion"></select>
    </div>
    <div class="form-group" id="grupoNombreManual" style="display:none">
      <label class="form-label">Nombre del medicamento</label>
      <div class="input-scan-wrap">
        <input type="text" class="form-control" id="fNombreManual" placeholder="Ej: Metformina 500mg">
        <button class="btn-scan-inline" onclick="abrirScan(true)" title="Escanear código">
          <span class="material-icons">qr_code_scanner</span>
        </button>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Pastillas actuales</label>
        <input type="number" class="form-control" id="fStock" min="0" placeholder="30">
      </div>
      <div class="form-group">
        <label class="form-label">Avisar cuando queden</label>
        <input type="number" class="form-control" id="fMinimo" min="1" value="7" placeholder="7">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Tomas por día</label>
        <input type="number" class="form-control" id="fTomasDia" min="1" value="1">
      </div>
      <div class="form-group">
        <label class="form-label">Fecha vencimiento</label>
        <input type="date" class="form-control" id="fVencimiento">
      </div>
    </div>

    <button class="btn-save" onclick="guardarInventario()">
      <span class="material-icons" style="vertical-align:middle;font-size:18px;margin-right:6px">save</span>
      Guardar
    </button>
    <button class="btn-cancel" onclick="document.getElementById('modalOverlay').style.display='none'">Cancelar</button>
  </div>
</div>

<!-- ══ Modal reabastecer ═════════════════════════ -->
<div id="reabOverlay" class="modal-overlay" style="display:none" onclick="document.getElementById('reabOverlay').style.display='none'">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="modal-title">
      <span class="material-icons">add_circle</span>
      <span>Reabastecer: <span id="reabNombre" style="color:#0288d1"></span></span>
    </div>

    <p style="font-size:.85rem;color:#6b7280;margin-bottom:4px">¿Cuántas pastillas compraste?</p>

    <!-- Accesos rápidos -->
    <div class="reab-btns">
      <button class="reab-btn" onclick="elegirReab(7)">+7</button>
      <button class="reab-btn" onclick="elegirReab(14)">+14</button>
      <button class="reab-btn" onclick="elegirReab(30)">+30</button>
      <button class="reab-btn" onclick="elegirReab(60)">+60</button>
    </div>

    <div class="form-group">
      <label class="form-label">Cantidad exacta</label>
      <input type="number" class="form-control" id="reabCantidad" min="1" placeholder="Ej: 28">
    </div>

    <button class="btn-save" onclick="confirmarReab()">
      <span class="material-icons" style="vertical-align:middle;font-size:18px;margin-right:6px">add_circle</span>
      Agregar al inventario
    </button>
    <button class="btn-cancel" onclick="document.getElementById('reabOverlay').style.display='none'">Cancelar</button>
  </div>
</div>

<script src="cordova.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/inventario.js"></script>
<script src="js/dark-mode.js"></script>
<script src="js/menu-bottom.js"></script>
</body>
</html>
