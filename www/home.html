<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <title>MyVita - Prescripción</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="css/home.css">
    <link rel="stylesheet" href="css/ui-enhancements.css">
    <!-- CSS del modo oscuro -->
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- CSS del menú inferior -->
    <link rel="stylesheet" href="css/menu-bottom.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="titulo-app">MyVita</h1>
        </header>

        <main class="app-content">
            <!-- BOTONES PRINCIPALES -->
            <div class="text-center mb-4">
                <button id="btnAgregarPrescripcion" class="btn-gradient" type="button">
                    <span class="material-icons">add</span> 
                    Agregar Prescripción
                </button>
                <button id="btnEscanearReceta" class="btn-gradient mt-3" type="button" style="background: linear-gradient(135deg, #00c853, #0288d1);">
                    <span class="material-icons">camera_alt</span> 
                    Escanear Receta
                </button>
                <!-- 🆕 BOTÓN DE DEBUG -->
                <button id="btnSincronizar" class="btn-gradient mt-3" type="button" style="background: linear-gradient(135deg, #ff6f00, #ffb74d);">
                    <span class="material-icons">sync</span> 
                    Sincronizar Ahora
                </button>
            </div>

            <!-- LISTA DE PRESCRIPCIONES -->
            <div id="contenedorPrescripciones" class="prescripciones-container">
                <h3>Prescripciones guardadas</h3>
                
                <div id="emptyPrescriptions" class="empty-prescriptions">
                    <span class="material-icons">description</span>
                    <h4>No tienes prescripciones aún</h4>
                    <p>Agrega tu primera prescripción médica para comenzar</p>
                </div>
                
                <ul id="prescripcionesList" class="prescripciones-list">
                    <!-- Las prescripciones se cargarán aquí dinámicamente -->
                </ul>
            </div>
        </main>

        <!-- MODAL DEL FORMULARIO -->
        <div id="formularioPrescripcion" class="modal-overlay">
            <div class="preinsc-card">
                <h3>Nueva Prescripción</h3>
                <form id="prescripcionForm" autocomplete="off">
                    <div class="form-group">
                        <label for="dosis" class="form-label">Dosis</label>
                        <input type="text" id="dosis" class="form-control" placeholder="Ej: 500mg" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="hora_toma" class="form-label">Hora</label>
                        <input type="time" id="hora_toma" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="frecuencia" class="form-label">Frecuencia</label>
                        <select id="frecuencia" class="form-select" required>
                            <option value="">Selecciona frecuencia</option>
                            <option value="una_vez_dia">Una vez al día</option>
                            <option value="dos_veces_dia">Dos veces al día</option>
                            <option value="tres_veces_dia">Tres veces al día</option>
                            <option value="personalizado">Personalizado</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="horario_personalizado" style="display: none;">
                        <label for="horario_personalizado_input" class="form-label">Horario personalizado</label>
                        <input type="text" id="horario_personalizado_input" class="form-control" placeholder="Ej: 8:00, 14:00, 20:00">
                    </div>
                    
                    <div class="form-group">
                        <label for="fecha_inicio" class="form-label">Fecha de inicio</label>
                        <input type="date" id="fecha_inicio" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="fecha_fin" class="form-label">Fecha de fin (opcional)</label>
                        <input type="date" id="fecha_fin" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="nombre_medico" class="form-label">Nombre del médico</label>
                        <input type="text" id="nombre_medico" class="form-control" placeholder="Dr. García">
                    </div>
                    
                    <div class="form-group">
                        <label for="contacto_medico" class="form-label">Contacto médico</label>
                        <input type="text" id="contacto_medico" class="form-control" placeholder="Teléfono o email">
                    </div>
                    
                    <div class="form-group">
                        <label for="via_administracion" class="form-label">Vía de administración</label>
                        <select id="via_administracion" class="form-select">
                            <option value="Oral">Oral</option>
                            <option value="Sublingual">Sublingual</option>
                            <option value="Tópica">Tópica</option>
                            <option value="Intravenosa">Intravenosa</option>
                            <option value="Intramuscular">Intramuscular</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-gradient">
                        <span class="material-icons">save</span> 
                        Guardar Prescripción
                    </button>
                    
                    <button id="btnCancelarFormulario" type="button" class="btn-cancelar">
                        <span class="material-icons">close</span> 
                        Cancelar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts en orden correcto -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cordova.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sync.js"></script>
    <script type="text/javascript" src="js/home.js"></script>
    <script src="js/dark-mode.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/menu-bottom.js"></script>
</body>
</html>
