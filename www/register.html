<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MyVita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fbff 0%, #e6f7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(2, 136, 209, 0.2);
            border: 1px solid #e0f7fa;
            position: relative;
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #00c853, #0288d1);
            border-radius: 24px 24px 0 0;
        }

        .register-card h1 {
            font-weight: 800;
            color: #0288d1;
            font-size: 1.8rem;
            margin-bottom: 24px;
            text-align: center;
            background: linear-gradient(90deg, #0288d1, #00c853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #0288d1;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: 18px;
            border: 2px solid #e0f7fa;
            background: #f8fdff;
            font-size: 1rem;
            font-weight: 500;
            color: #222;
        }

        .form-control:focus {
            outline: none;
            border-color: #0288d1;
            box-shadow: 0 0 0 0.25rem rgba(2, 136, 209, 0.25);
            background: white;
        }

        .terms-group {
            margin: 20px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .terms-group label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            color: #444;
            font-weight: 500;
        }

        .terms-group input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .terms-link {
            color: #0288d1;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed #0288d1;
        }

        .terms-link:hover {
            color: #00c853;
            border-bottom-color: #00c853;
            text-decoration: none;
        }

        .btn-register {
            background: linear-gradient(135deg, #00c853, #0288d1);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(2, 136, 209, 0.25);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(2, 136, 209, 0.35);
        }

        .form-list-footer {
            text-align: center;
            margin-top: 20px;
        }

        .form-list-footer a {
            color: #0288d1;
            text-decoration: none;
            font-weight: 600;
        }

        .form-list-footer a:hover {
            text-decoration: underline;
            color: #00c853;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 28px 20px;
            }
            .register-card h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
<div class="register-card">
    <h1>Registro</h1>

    <form id="registerForm">
        <div class="form-group">
            <label>Nombre completo</label>
            <input type="text" id="nombre" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Usuario</label>
            <input type="text" id="usuario" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="pass" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Fecha de nacimiento</label>
            <input type="date" id="fecha_nacimiento" class="form-control">
        </div>

        <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="telefono" class="form-control">
        </div>

        <div class="form-group">
            <label>Dirección</label>
            <input type="text" id="direccion" class="form-control">
        </div>

        <div class="terms-group">
            <label>
                <input type="checkbox" id="termsCheckbox">
                Acepto los Términos y Condiciones
            </label>
        </div>

        <button type="submit" class="btn-register">
            <span class="material-icons">person_add</span>
            Crear cuenta
        </button>
    </form>

    <div class="form-list-footer">
        <a href="index.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
</div>

<script src="cordova.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/register.js"></script>
<script src="js/animations.js"></script>

</body>
</html>
