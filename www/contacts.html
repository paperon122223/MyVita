<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contactos de Emergencia - MyVita</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome para WhatsApp -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Estilos principales -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/ui-enhancements.css">
  <link rel="stylesheet" href="css/contacts.css">
  <!-- CSS del modo oscuro -->
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/animations.css">
 <link rel="stylesheet" href="css/menu-bottom.css">
</head>
<body>
  <div class="app-container">
    <!-- Encabezado -->
    <header class="app-header">
      <h1 class="contacts-title">Contactos de Emergencia</h1>
      
      <!-- Barra de búsqueda -->
      <div class="search-container">
        <span class="material-icons search-icon">search</span>
        <input type="text" id="searchContact" class="search-input" placeholder="Buscar contacto...">
      </div>
      
      <!-- Botones de acción -->
      <div class="action-buttons">
        <button id="addContact" class="btn-add">
          <span class="material-icons">person_add</span>
          Agregar
        </button>
        <button id="sendSelectedMessage" class="btn-message">
          <span class="material-icons">message</span>
          Mensaje
        </button>
      </div>
    </header>
    
    <!-- Listado de contactos -->
    <main class="app-content">
      <div class="empty-state" id="emptyState" style="display: none;">
        <span class="material-icons">groups</span>
        <h3>Sin contactos</h3>
        <p>Agrega tus contactos de emergencia</p>
      </div>
      
      <ul id="contactsList" class="contacts-list">
        <!-- Los contactos se cargarán dinámicamente aquí -->
      </ul>
    </main>

  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="cordova.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/contacts.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/bottom-nav.js"></script>
  <script src="js/menu-bottom.js"></script>
</body>
</html>
